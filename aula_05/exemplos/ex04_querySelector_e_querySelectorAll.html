<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
</head>
<body>

    <p>Parágrafo 1</p>
    <p class="classe">Parágrafo 2</p>
    <p id="identificador">Parágrafo 3</p>

    <script>

        // Seleciona a primeira tag <p>
        const tag = document.querySelector("p")
        console.log("Tag:", tag)

        // Seleciona pela classe
        const classe = document.querySelector(".classe")
        console.log("Classe:", classe)

        // Seleciona pelo id
        const id = document.querySelector("#identificador")
        console.log("ID:", id)

        // Seleciona todos os <p>
        const todosParagrafos = document.querySelectorAll("p")
        console.log("Todos os parágrafos:", todosParagrafos)

    </script>

</body>
</html>
