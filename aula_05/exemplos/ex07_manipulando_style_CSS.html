<!DOCTYPE html>
<html>
<head>
    <title>Manipulando Style</title>
</head>
<body>

    <h1 id="titulo">MANIPULANDO STYLE</h1>

    <button id="aplicar">Aplicar Estilos</button>

    <script>

        const titulo = document.querySelector("#titulo")
        const aplicar = document.querySelector("#aplicar")

        aplicar.addEventListener("click", () => {

            titulo.style.color = "white"
            titulo.style.backgroundColor = "green"
            titulo.style.fontSize = "32px"
            titulo.style.padding = "15px"
            titulo.style.borderRadius = "8px"
            titulo.style.textAlign = "center"

        })

    </script>

</body>
</html>
