<!DOCTYPE html>
<html>
<head>
    <title>Manipulando Classes</title>

    <style>
        .destaque {
            color: white;
            background-color: blue;
            padding: 10px;
            font-size: 28px;
            border-radius: 5px;
        }
    </style>

</head>
<body>

    <h1 id="titulo">MANIPULANDO CLASSES</h1>

    <button id="adicionar">Adicionar Classe</button>
    <button id="remover">Remover Classe</button>
    <button id="toggle">Toggle Classe</button>

    <script>

        const titulo = document.querySelector("#titulo")

        const adicionar = document.querySelector("#adicionar")
        const remover = document.querySelector("#remover")
        const toggle = document.querySelector("#toggle")

        // Adiciona classe
        adicionar.addEventListener("click", () => {
            titulo.classList.add("destaque")
        })

        // Remove classe
        remover.addEventListener("click", () => {
            titulo.classList.remove("destaque")
        })

        // Alterna classe
        toggle.addEventListener("click", () => {
            titulo.classList.toggle("destaque")
        })

    </script>

</body>
</html>
