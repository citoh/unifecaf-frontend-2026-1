<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
</head>
<body>

    <p id="texto1">Parágrafo original</p>
    <p id="texto2">Parágrafo original</p>

    <script>

        // Alterando apenas o texto
        const texto1 = document.querySelector("#texto1")
        texto1.innerText = "<strong>Texto alterado com innerText</strong>"
        console.log(texto1)

        // Alterando com HTML
        const texto2 = document.querySelector("#texto2")
        texto2.innerHTML = "<strong>Texto alterado com innerHTML</strong>"
        console.log(texto2)

    </script>

</body>
</html>
